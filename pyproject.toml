[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-analyzer-skills"
version = "1.0.0"
description = "Video Analyzer optimization skills for Claude Code, Codex, and OpenClaw"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "hobart9527"},
]
keywords = ["video", "analyzer", "skills", "claude", "codex", "openclaw", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
vas = "video_analyzer_skills.cli:main"
video-analyzer-skills = "video_analyzer_skills.cli:main"

[project.urls]
Homepage = "https://github.com/hobart9527/video-analyzer-skills"
Repository = "https://github.com/hobart9527/video-analyzer-skills"
Issues = "https://github.com/hobart9527/video-analyzer-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["video_analyzer_skills"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
